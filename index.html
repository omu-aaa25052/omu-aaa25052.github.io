  <h2>好きな食べ物</h2>
  <p>私の好きな食べ物を3つ紹介します。</p>

  <h2>1. たこ焼き</h2>
  <p>大阪人のソウルフードです。実家に2台たこ焼き器があり、週に一回たこ焼きデーと称してタコパをしていまさいた。</p>

  <h2>2. ラーメン</h2>
  <p>しょうゆ、みそ、とんこつなど、地域によって味が違います。個人的にとんこつが一番好きです。</p>

  <h2>3. ミルクレープ</h2>
  <p>小麦粉の生地にクリームを挟んで重ねたケーキです。カスタードやフルーツをはさんだものなど様々なアレンジがされていますが生クリームだけが一番おすすめです。</p>
